name: Part 2 - Build and Test

# Runs on every push and pull request so the green tick stays current
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore Part2/RaceDay.slnx

      - name: Build
        run: dotnet build Part2/RaceDay.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Part2/RaceDay.slnx --no-build --configuration Release --verbosity normal