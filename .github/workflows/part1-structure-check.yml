name: Part 1 - Repository Structure Check

# Runs on every push/PR so the "green check" required by the brief stays up to date.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs/ folder found."

      - name: Check required planning files exist
        run: |
          required_files=(
            "docs/RaceDay_ERD.png"
            "docs/RaceDay_API_Endpoint_Plan.md"
            "docs/RaceDay_Schema.sql"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              missing=1
            else
              echo "Found: $file"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing from repository root."
            exit 1
          fi
          echo "README.md found."

      - name: Structure check passed
        run: echo "All required Part 1 files are present. Structure check passed."
